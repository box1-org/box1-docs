# Cleaned export from the Box1 cluster (status and live metadata removed).
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: box1-storage
  namespace: openshift-lvm-storage
spec:
  storage:
    deviceClasses:
    - default: true
      deviceSelector:
        paths:
        - /dev/disk/by-id/nvme-Fanxiang_S690Q_1TB_26081421636001649
      fstype: xfs
      name: vg1
      thinPoolConfig:
        chunkSizeCalculationPolicy: Static
        metadataSizeCalculationPolicy: Host
        name: thin-pool-1
        overprovisionRatio: 2  # raised from 1 on 2026-11-06 (see achievements/2026/2026-11-06-pv-capacity-audit.md)
        sizePercent: 90
