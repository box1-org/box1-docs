# Cleaned export from the Box1 cluster (status and live metadata removed).
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - htpasswd:
      fileData:
        name: htpasswd-xtglx
    mappingMethod: claim
    name: htpasswd
    type: HTPasswd
  - mappingMethod: add
    name: keycloak
    openID:
      claims:
        email:
        - email
        name:
        - name
        preferredUsername:
        - preferred_username
      clientID: openshift
      clientSecret:
        name: keycloak-openshift-client
      extraScopes:
      - email
      - profile
      issuer: https://keycloak.apps.ocp.box1.org/auth/realms/box1
    type: OpenID
