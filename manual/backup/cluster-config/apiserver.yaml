# Cleaned export from the Box1 cluster (status and live metadata removed).
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
spec:
  audit:
    profile: Default
  servingCerts:
    namedCertificates:
    - names:
      - api.ocp.box1.org
      servingCertificate:
        name: openshift-api-tls
