# Cleaned export from the Box1 cluster (status and live metadata removed).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    openshift.io/description: ''
    openshift.io/display-name: ''
    openshift.io/requester: kube:admin
  name: vllm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models-cache
  namespace: vllm
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 65Gi
  storageClassName: lvms-vg1
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-test
  namespace: vllm
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vllm-test
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-test
    spec:
      containers:
      - args:
        - --model
        - nvidia/Qwen3.8-27B-NVFP4
        - --served-model-name
        - box1-coder
        - --max-model-len
        - '98304'
        - --max-num-seqs
        - '1'
        - --gpu-memory-utilization
        - '0.85'
        - --kv-cache-dtype
        - fp8
        - --quantization
        - modelopt_fp4
        - --moe-backend
        - marlin
        - --attention-backend
        - flashinfer
        - --max-num-batched-tokens
        - '8192'
        - --enable-chunked-prefill
        - --enable-prefix-caching
        - --language-model-only
        - --skip-mm-profiling
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_xml
        - --reasoning-parser
        - qwen3
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env:
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: HF_HOME
          value: /models/huggingface
        - name: VLLM_CACHE_ROOT
          value: /tmp/.cache/vllm
        - name: VLLM_CONFIG_ROOT
          value: /tmp/.config/vllm
        - name: CUDA_CACHE_PATH
          value: /tmp/.cache/cuda
        - name: HF_HUB_CACHE
          value: /models/huggingface/hub
        image: vllm/vllm-openai:v0.28.0
        imagePullPolicy: IfNotPresent
        name: vllm
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: '1'
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: vllm-models-cache
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: vllm-models-cache
        persistentVolumeClaim:
          claimName: vllm-models-cache
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-frontend
  namespace: vllm
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 9376
  selector:
    app: vllm-test
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-test-2
  namespace: vllm
spec:
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: vllm-test
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: route-purple-bass
  namespace: vllm
spec:
  port:
    targetPort: 8000
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: vllm-test-2
    weight: 100
  wildcardPolicy: None
