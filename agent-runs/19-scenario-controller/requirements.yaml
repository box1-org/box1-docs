# Requirement ledger, run 19 (scenario controller), frontier profile.
# IDs derive from 09_scenario_controller.md acceptance evidence (AC-*), the frontier verification scenarios (VS-*) and
# interface constraints (SC-*). Status is the highest level actually observed:
#   proposed -> implemented -> locally_tested -> ci_verified -> deployed -> live_verified
# "locally_tested" here means one or both of: the container suite (real PostgreSQL, fake upstreams; evidence/03) and the
# local end-to-end run against the real services and ERP harness (evidence/04). Neither is cluster proof.
# Parent IDs from the white paper: FR-09, OBS-06, DEMO-A/B/C (defined only in the PDF).
# Source: scenario-controller run19-controller 7f0f9ea (after Phase 5 repairs); inventory-service run19-fixture-admin fca04be.
# "ci_verified": the CI-set tests named in the entry passed in the cluster's PR pipeline (evidence/06-ci.txt,
# scenario-controller-validate-std6t on 7f0f9ea). Container tests and the end-to-end run are not part of CI.
# All local results were rerun after the reviewer repairs (evidence/03 last block, evidence/07).
# Phase 6 (evidence/08-delivery.md): scenario-controller f64dee6 is deployed to scenario-controller-dev (image
# sha256:a811c457...b269, workloads e28c020) and inventory-service ad472e1 to inventory-service-dev. "deployed" = running
# on the cluster; entries still marked locally_tested run there too but have not been exercised on the cluster yet
# (seeding and runs await approval).

- id: AC-1
  description: Attempt to run in a non-demo namespace fails closed; unknown scenario name rejected
  status: locally_tested
  implementation: [src/main/java/org/box1/scenario/Gate.java, src/main/java/org/box1/scenario/run/Engine.java]
  tests: [GateTest.everyActionIsRefusedAndAudited, ScenarioRunsTest.notYetPossibleAndUnknownScenariosAreRefusedAndAudited, SecurityTest.unknownAndMalformedNamesGetAPlain404]
  commands: ["./mvnw -B -Pcontainers verify -DskipITs=false", "evidence/scripts/e2e.py auth"]
  evidence: [evidence/03-test-suites.txt, evidence/04-local-e2e.txt]
  limitations: [Non-allowlisted namespace proven in the container suite only, not against the real JVM stack]
- id: AC-2
  description: Every named fault has bounded duration, complete audit trail, stop/reset behavior and positive end-state verification
  status: locally_tested
  implementation: [src/main/resources/catalog/scenarios.yaml, src/main/java/org/box1/scenario/run/Engine.java, src/main/java/org/box1/scenario/scenarios/]
  tests: [CatalogTest.everyScenarioHasItsTitleAndClassifiedMechanism, ScenarioRunsTest.stopEndsTheRunAndResets]
  commands: ["evidence/scripts/e2e.py (all steps)"]
  evidence: [evidence/04-local-e2e.txt, evidence/07-local-e2e-after-review.txt]
  limitations: [The controller enables no fault itself; ERP faults are set and undone at the ERP console (RESET_GUIDED). Five scenarios are not yet possible and have no fault code.]
- id: AC-3
  description: ERP delayed processing or a manual hold reproduces alert and long-running order without data loss; inventory contention shows one reservation
  status: live_verified
  live_evidence: ["evidence/12: erp-manual-hold VERIFIED on the cluster; evidence/11 contention; alert = fulfillment_held gauge (no alert rule)"]
  implementation: [src/main/java/org/box1/scenario/scenarios/ErpManualHold.java, ErpDelayedProcessing.java, InventoryContention.java]
  tests: [ScenarioRunsTest.holdThatOrderNumberOneIsVerifiedThroughTheAdapter, ScenarioRunsTest.impulsePowerOnlyNeedsAVisibleDelay]
  commands: ["evidence/scripts/e2e.py hold delay tribbles"]
  evidence: [evidence/04-local-e2e.txt, evidence/07-local-e2e-after-review.txt]
  limitations: ["No alert rule exists on the platform (no PrometheusRule); the alert half is the adapter's fulfillment_held gauge, required to rise over its baseline while held", "ERP faults and holds have no ERP-side expiry (review ARCH-4)"]
- id: AC-4
  description: Interrupted orchestration process does not leave a fault permanently enabled beyond TTL
  status: locally_tested
  implementation: [Engine.recover, Engine.sweep]
  tests: [AbandonedRunTest.aRunLeftByADeadProcessIsAbortedAndResetAtStartup, AbandonedRunTest.aRunPastItsTtlWithNoThreadIsExpiredAndReset]
  commands: ["evidence/scripts/e2e.py kill (SIGKILL mid-run, 45 s down past a 30 s TTL, restart)"]
  evidence: [evidence/04-local-e2e.txt, evidence/07-local-e2e-after-review.txt]
  limitations: [Pod-level restart on the cluster not exercised]
- id: AC-5
  description: Fixtures seed idempotently through service APIs; seeding twice gives the same state; nothing outside the fixture set is changed or deleted
  status: live_verified
  live_evidence: ["evidence/11 and 12: seeds created=26 then created=0 unchanged=26 on the cluster"]
  live_evidence: ["evidence/11: first cluster seed created=26 through inventory's API; a second seed (idempotence) not yet run live"]
  implementation: [src/main/java/org/box1/scenario/fixtures/, inventory-service#3]
  tests: [ScenarioRunsTest.seedingTwiceGivesTheSameStateAndTouchesOnlyFixtures, inventory ReservationScenariosTest.sitesAndStockRecordsAreCreatedOnceAndNeverChanged]
  commands: ["evidence/scripts/e2e.py seed collateral"]
  evidence: [evidence/04-local-e2e.txt, evidence/07-local-e2e-after-review.txt]
  limitations: [Cluster seeding needs inventory-service#3 merged, the Keycloak clients, and approval]
- id: AC-6
  description: '"The Trouble with Tribbles" ends with exactly one reservation for the last tribble and one rejected order'
  status: live_verified
  live_evidence: ["evidence/11-live-seed-and-tribbles.md: run scn_2bbc06797d066122ba9e VERIFIED on the cluster, one reservation and one INSUFFICIENT_STOCK rejection, reset restored 0->1"]
  tests: [ScenarioRunsTest.theTroubleWithTribblesHasExactlyOneWinnerAndCanBeRepeated]
  commands: ["evidence/scripts/e2e.py tribbles"]
  evidence: [evidence/04-local-e2e.txt, evidence/07-local-e2e-after-review.txt]
- id: AC-7
  description: Guided ERP scenarios state the console step and verify before reporting success; a step not performed times out as not verified
  status: locally_tested
  tests: [ScenarioRunsTest.aGuidedStepNotPerformedTimesOutAsNotVerified]
  commands: ["evidence/scripts/e2e.py hold timeout delay crash"]
  evidence: [evidence/04-local-e2e.txt, evidence/07-local-e2e-after-review.txt]
  limitations: [The local console step was performed through the ERP domain API, not the TUI. The crash scenario relies on audited operator confirmations for what the controller cannot observe.]
- id: AC-8
  description: Every scenario shows its display title, while IDs, errors and audit fields stay plain
  status: live_verified
  live_evidence: ["evidence/09-operator-access.md: cluster catalog shows all ten titles with plain IDs"]
  tests: [CatalogTest.everyScenarioHasItsTitleAndClassifiedMechanism, SecurityTest.aViewerReadsTheCatalogWithTitles]
  evidence: [evidence/04-local-e2e.txt, evidence/07-local-e2e-after-review.txt]

